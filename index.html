<title>Les Aventuriers de l’Île Mystérieuse</title>
<style>
:root{--bg:#f6e7b8;--bgimg:linear-gradient(180deg,#8fdde0 0%,#cdeede 35%,#f6e7b8 70%,#e9c98a 100%);--card:#fffaf0;--ink:#2b2118;--mut:#5c4a38;--acc:#0b6f6a;--acc2:#d9822b;--line:#c9a45c;--ok:#dff3e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13222b;--card:#1d3340;--ink:#f1ede2;--mut:#b7c4cc;--acc:#4fc3cd;--acc2:#f0b95a;--line:#35505f;--ok:#21423a}}
:root[data-theme="dark"]{--bg:#13222b;--card:#1d3340;--ink:#f1ede2;--mut:#b7c4cc;--acc:#4fc3cd;--acc2:#f0b95a;--line:#35505f;--ok:#21423a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bgimg,var(--bg)) fixed;min-height:100vh;color:var(--ink);font:18px/1.55 Verdana,Tahoma,system-ui,sans-serif}h1,h2,h3{font-family:'Palatino Linotype','Book Antiqua',Georgia,serif;letter-spacing:.3px}h1{text-shadow:0 2px 0 #fff8}body::before{content:'';position:fixed;inset:0;background:#08161d;opacity:0;pointer-events:none;z-index:-1}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{opacity:.7}}:root[data-theme="dark"] body::before{opacity:.7}
body[data-bg=map]{--bgimg:linear-gradient(180deg,#7fd6e8 0%,#4fb8c9 28%,#bfe8d8 50%,#f3dfa2 70%,#e5bf7d 100%)}body[data-bg=jungle]{--bgimg:linear-gradient(180deg,#b6efb0,#6fbf7d 55%,#3f8a57)}body[data-bg=lac]{--bgimg:linear-gradient(180deg,#bfe9f7,#6cc0e0 60%,#3b9fc4)}body[data-bg=pont],body[data-bg=allies],body[data-bg=village]{--bgimg:linear-gradient(180deg,#ffe3b0,#f6b86b 70%,#e69a4d)}body[data-bg=montagne],body[data-bg=falaise]{--bgimg:linear-gradient(180deg,#bfe0f7,#d9c9a8 60%,#a98a63)}body[data-bg=grotte]{--bgimg:linear-gradient(180deg,#e0d6f0,#b3a4cf 70%,#8f7fb0)}body[data-bg=camp],body[data-bg=plage]{--bgimg:linear-gradient(180deg,#ffe0b0,#f6b78a 60%,#e9c98a)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:#5a3a1a;color:#fff3d6;border-bottom:4px solid #d9a441}
main{max-width:820px;margin:0 auto;padding:16px}h1,h2{line-height:1.25}
button{font:inherit;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--acc);background:var(--card);color:var(--ink);cursor:pointer;margin:4px 4px 4px 0}
button:hover{background:var(--ok)}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.p{background:var(--acc);color:#fff}button[disabled]{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.t{box-shadow:0 4px 0 #0002;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;animation:in .4s both}
.t .ic{font-size:2.2rem}.t h3{margin:.2rem 0}.t p{margin:.2rem 0 .6rem;color:var(--mut);font-size:.95rem}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.fb{background:var(--ok);border-radius:12px;padding:12px;margin-top:10px}.mut{color:var(--mut);font-size:.95rem}
.coco{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:2px solid var(--acc2);border-radius:16px;padding:10px;margin:10px 0}.coco i{font-size:2.4rem;font-style:normal}
input[type=text]{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;max-width:420px}
.big{font-size:2.4rem;letter-spacing:.3rem}
.bub{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff9,var(--acc));margin:50px auto;transition:transform 4s ease-in-out}
.bag{min-height:110px;border:3px dashed var(--acc);border-radius:16px;padding:10px;margin:8px 0}
.chip{border-radius:20px;min-height:44px;cursor:grab}.sh{animation:sh .3s}
details{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0}summary{cursor:pointer;font-weight:bold;min-height:36px}
.chest{position:relative;width:200px;height:170px;margin:70px auto 20px}.cb{position:absolute;bottom:0;width:200px;height:90px;background:#8b5a2b;border:4px solid #5a3a1a;border-radius:6px 6px 12px 12px}.cb:after{content:'';position:absolute;left:50%;top:10px;width:26px;height:34px;margin-left:-13px;background:#e8a33d;border-radius:4px}.lid{position:absolute;bottom:90px;width:200px;height:60px;background:#a0692f;border:4px solid #5a3a1a;border-radius:70px 70px 0 0;transform-origin:left bottom;transition:transform .8s ease-out;z-index:2}.open .lid{transform:rotate(-105deg)}.open .cb{box-shadow:0 -14px 30px #ffd34a}.coin{position:absolute;bottom:90px;left:50%;font-size:2rem;z-index:1;opacity:0;animation:jet 1.8s ease-out forwards}@keyframes jet{0%{transform:translate(0,0) scale(.5);opacity:1}55%{transform:translate(var(--x),-200px) scale(1.1);opacity:1}100%{transform:translate(calc(var(--x)*1.3),30px) rotate(360deg);opacity:0}}:root[data-calm] .coin{display:none}@media (prefers-reduced-motion:reduce){.coin{display:none}}.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.hint{outline:4px solid var(--acc2);outline-offset:2px}button[disabled][style*="2e9e5b"]{opacity:1}.gr span{display:flex;align-items:center;justify-content:center;min-height:52px;font-size:1.8rem}.cell{font-size:1.6rem;min-height:52px;padding:4px;margin:0}.cell.ok{background:#2e9e5b!important;color:#fff;border-color:#2e9e5b}.pz{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:60}.pz .box{max-width:440px;margin:16px}.sqb{position:relative;width:160px;height:160px;border:4px solid var(--acc);border-radius:8px;margin:50px auto}.sqb i{position:absolute;left:0;top:100%;width:26px;height:26px;border-radius:50%;background:var(--acc2);transform:translate(-50%,-50%);transition:left linear,top linear}.am{display:inline-block}.a1{animation:up 2s ease-in-out infinite}.a2{animation:rock 2s ease-in-out infinite}.a3{animation:spin 3s linear infinite}.a4{animation:pls 2.5s ease-in-out infinite}@keyframes up{50%{transform:translateY(-24px) scale(1.1)}}@keyframes rock{50%{transform:rotate(25deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pls{50%{transform:scale(1.25)}}.av{width:84px;height:84px;object-fit:contain;flex:none}.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}.cf{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards}.bl{position:absolute;bottom:-70px;font-size:2.6rem;animation:rise linear forwards}.st{bottom:auto;top:-40px;animation-name:fall}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx,0px))}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
:root[data-calm] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

function map(){const all=ORD.concat(['camp']);app.innerHTML=`<h1>🗺️ La carte de l’île</h1><div class="big" aria-hidden="true" style="text-align:center">🌴 🌊 ⛵ 🌊 🏝️</div>${coco('Suis le parcours dans l’ordre : chaque territoire s’ouvre quand tu as réussi un niveau du précédent. Le camp et le phare sont toujours ouverts.')}<div class="grid"><div class="t"><div class="ic">🏮</div><h3>1. Le phare des Parents</h3><p>Les parents commencent ici.</p><button class="p" onclick="go('phare')">Entrer</button></div>${all.map(id=>{const g=G[id],lk=tLock(id),n=ORD.indexOf(id)+1;return `<div class="t"><div class="ic" aria-hidden="true">${g.i}</div><h3>${n?(n+1)+'. ':''}${g.n}</h3><p>Niveaux réussis : ${lvDone(id)}/${g.l.length}${lvDone(id)==g.l.length?' 🏅':''}</p>${lk=='prem'?`<button class="p" onclick="go('premium')">🔒 Premium</button>`:lk?`<span class="mut">🔒 Réussis un niveau de « ${G[ORD[n-2]].n} »</span>`:`<button class="p" onclick="go('t/${id}')">Entrer</button>`}</div>`}).join('')}${lvDone('falaise')==G.falaise.l.length?`<div class="t"><div class="ic">🧰</div><h3>Le coffre au trésor</h3><p>Ta récompense finale !</p><button class="p" onclick="go('coffre')">Ouvrir</button></div>`:''}</div><button id="rs" onclick="resetP()">🗑️ Effacer ma progression</button>`}
function feel(){const S={'😊 Joie':'Super ! Profite-en.','😌 Calme':'Génial, note ce qui t’aide à être calme.','😰 Stress':'Va au camp faire la bulle d’air 🫧.','😠 Colère':'Fais une pause et étire-toi, puis dis ce dont tu as besoin.','😢 Tristesse':'Tu peux en parler à un adulte de confiance.','😤 Frustration':'Découpe la tâche ou demande de l’aide.','🥱 Fatigue':'Une pause ou un verre d’eau peut aider.'};setTimeout(()=>document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{$('#ef').innerHTML=`<div class="fb">${S[b.dataset.e]}</div>`}));return `<div class="box"><b>Comment tu te sens aujourd’hui ?</b> <span class="mut">(facultatif, rien n’est enregistré)</span><div>${EM.map(e=>`<button data-e="${e}">${e}</button>`).join('')}</div><div id="ef" aria-live="polite"></div></div>`}
function terr(id){const g=G[id],lk=tLock(id);if(lk=='prem')return premium();if(lk){app.innerHTML=`<h1>🔒 Pas encore</h1>${coco('Réussis d’abord un niveau de « '+G[ORD[ORD.indexOf(id)-1]].n+' » !')}<button class="p" onclick="go('map')">Retour à la carte</button>`;return}
app.innerHTML=`<h1>${g.i} ${g.n}</h1>${coco(g.c)}${id=='lac'?feel():''}<div class="grid">${g.l.map((l,i)=>`<div class="t"><div class="ic" aria-hidden="true">${l.i}</div><h3>Niveau ${i+1}</h3><p>${l.n}${P.d[id+i]?'<br>'+'⭐'.repeat((P.s||{})[id+i]||1):''}</p>${g.open||i==0||P.d[id+(i-1)]?`<button class="p" onclick="go('l/${id}/${i}')">${P.d[id+i]?'✅ Rejouer':'Jouer'}</button>`:'🔒 Réussis le niveau '+i}</div>`).join('')}</div><button onclick="go('map')">← Carte</button>`}
function play(id,i){const g=G[id],l=g.l[i];CUR=[id,i];ERR=0;P.at=P.at||{};P.at[id+i]=(P.at[id+i]||0)+1;if(!l||tLock(id)||!(g.open||i==0||P.d[id+(i-1)]))return terr(id);E[l.t](l,()=>{if(ERR>0&&(P.at[id+i]||1)<3){app.innerHTML=`<h1>Presque ! 💪</h1>${coco('Tu as fait '+ERR+' faute'+(ERR>1?'s':'')+'. Recommence pour décrocher plus d’étoiles : au bout de 3 essais, le niveau s’ouvre quand même. Respire et vas-y !')}<p><button class="p" onclick="play('${id}',${i})">🔁 Recommencer le niveau</button> <button onclick="go('t/${id}')">Retour aux niveaux</button></p>`;return}const first=!P.d[id+i];if(first){P.s=P.s||{};P.s[id+i]=Math.max(1,4-(P.at[id+i]||1))}P.d[id+i]=1;sv();$('#cn').textContent='🥥 '+nC();const all=lvDone(id)==g.l.length;fx(first&&all?'ball':'conf');if(first&&MS.includes(nC()))setTimeout(()=>fx('star'),900);app.innerHTML=`<h1>🎉 Bravo ! ${'⭐'.repeat((P.s||{})[id+i]||1)}</h1>${coco((ERR>0?'Tu as bien persévéré : on ouvre la suite ! ':'')+(first?'Tu gagnes une noix de coco 🥥 ! Chaque petit pas est une victoire.':'Bien joué, tu as rejoué ce niveau !'))}${first&&all?'<div class="fb">🏆 Thème terminé : '+g.n+' !</div>':''}${all&&id=='falaise'?'<p><button class="p" onclick="go(&quot;coffre&quot;)">🧰 Ouvrir le coffre au trésor</button></p>':''}${first&&MS.includes(nC())?'<div class="fb">🏅 Badge obtenu : '+nC()+' noix de coco !</div>':''}<p>${g.l[i+1]?`<button class="p" onclick="go('l/${id}/${i+1}')">Niveau suivant →</button>`:''}<button onclick="go('t/${id}')">Retour à ${g.n}</button> <button onclick="go('map')">Carte</button></p>`})}
function premium(){app.innerHTML=`<h1>🔒 Territoires Premium</h1><div class="box"><p>Gratuit : la plage, la jungle, le pont, le camp et le phare. Premium : <b>tous les autres territoires</b>.</p><p class="mut">Le paiement n’est pas encore branché : le lien d’achat sera ajouté plus tard.</p><p>Parents : vous pouvez aussi ouvrir l’accès en relevant <button onclick="go('phare')">le défi des parents</button>.</p><p><input type="text" id="cd" placeholder="Code d’accès" aria-label="Code d’accès"> <button class="p" id="ok">Débloquer</button></p><div id="msg" aria-live="polite"></div><p class="mut">Démo : ce code est visible dans le code de la page, ce n’est donc pas une vraie protection.</p><button onclick="UNL=false;try{localStorage.removeItem('prem2')}catch(e){}go('map')">🔁 Re-verrouiller le Premium (test)</button></div><button onclick="go('map')">Retour à la carte</button>`;$('#ok').onclick=()=>{if($('#cd').value.trim().toUpperCase()==CODE){UNL=true;try{localStorage.setItem('prem2','1')}catch(e){}$('#msg').innerHTML='<div class="fb">Débloqué ! Bonne aventure.</div>'}else $('#msg').innerHTML='<div class="fb">Ce code ne fonctionne pas. Tu peux réessayer.</div>'}}
function phare(){app.innerHTML=`<h1>🏮 Le phare des Parents</h1><div class="box"><p>Bienvenue. Ce site est un support de jeu et de sensibilisation. Il ne pose aucun diagnostic, n’évalue pas votre enfant et ne remplace pas l’accompagnement d’un professionnel. Il n’y a ni classement, ni points perdus, ni chrono : votre enfant peut se tromper et recommencer sans conséquence.</p></div>
<details open><summary>Le projet du site</summary><p>« Les Aventuriers de l’Île Mystérieuse » est un projet de jeux pour les enfants de 10 à 14 ans, pensé notamment pour ceux qui ont du mal avec l’attention ou l’organisation, comme dans le TDAH. L’idée : apprendre par le jeu, à son rythme, dans une aventure sur une île. Capitaine Coco guide l’enfant pas à pas.</p><p><b>Règle du jeu :</b> l’enfant vise un niveau sans faute. Une faute n’est jamais une punition : aucun point n’est perdu, des astuces s’affichent et l’enfant peut recommencer. Après 3 essais, le niveau suivant s’ouvre quand même : il n’est jamais bloqué. Il gagne 1 à 3 étoiles ⭐ selon le nombre d’essais, mais ce n’est jamais une comparaison avec d’autres enfants.</p></details><details><summary>La logique de l’aventure</summary><p>Le parcours suit une progression : attention (jungle), comprendre les autres (pont), les émotions (lac), s’organiser (village), la vie sociale (alliés), les apprentissages (montagne), le raisonnement (grotte), puis la confiance en soi (falaise). Les niveaux sont courts et de plus en plus riches. Chaque niveau réussi donne une noix de coco 🥥 : on récompense l’effort et la persévérance, jamais la vitesse. Le Capitaine Coco guide l’enfant pas à pas.</p></details>
<details><summary>Ce que travaille chaque territoire</summary><ul><li><b>Jungle :</b> attention et mémoire de travail, par petits défis visuels.</li><li><b>Pont :</b> comprendre que chacun sait et pense des choses différentes (théorie de l’esprit).</li><li><b>Lac :</b> reconnaître et nommer les émotions, découvrir des façons de se calmer.</li><li><b>Village des Organisateurs :</b> découper une tâche en petites étapes.</li><li><b>Alliés :</b> commencer une conversation, écouter, régler un désaccord, respecter les limites.</li><li><b>Montagne et grotte :</b> vocabulaire, calcul, lecture, logique et flexibilité mentale.</li><li><b>Falaise :</b> identifier ses forces, accepter l’erreur, se parler avec bienveillance.</li><li><b>Camp :</b> respiration et retour au calme.</li></ul><p class="mut">Ce sont des objectifs pédagogiques, pas des résultats garantis.</p></details>
<details><summary>Comment accompagner</summary><ul><li>Des sessions de 10 à 15 minutes, avec une pause prévue.</li><li>Félicitez l’effort : « Tu as essayé autrement, bravo ! »</li><li>Devoirs : demandez « Quelle est la première petite étape ? »</li><li>Malentendu : « Qu’as-tu compris ? Qu’a pu comprendre l’autre ? Que pourrais-tu lui demander ? »</li><li>Routines : horaires prévisibles et pauses visibles.</li></ul></details>
<details><summary>Confidentialité</summary><p>Pas de compte, pas de publicité, aucune réponse envoyée à un serveur. Seuls la progression et les préférences restent sur l’appareil, et s’effacent avec le bouton « Effacer ma progression » de la carte.</p></details>
<details><summary>Pour aller plus loin</summary><p>Parlez-en à votre médecin ou au professionnel qui suit votre enfant. Vous pouvez aussi consulter les sites officiels de la Haute Autorité de santé et de l’association TDAH France.</p></details><details open><summary>🎮 Le défi des parents</summary><p>Relevez un petit défi de 4 questions pour ouvrir à votre enfant l’accès à tous les territoires de l’île.</p><button class="p" onclick="pq()">Commencer le défi</button></details><p><button class="p" onclick="go('t/plage')">🏝️ Étape 2 : lancer l’aventure avec mon enfant</button></p><button onclick="go('map')">← Carte</button>`}
function render(){clr();{const h=(location.hash||'#home').slice(1).split('/');document.body.dataset.bg=(h[0]=='t'||h[0]=='l')?h[1]:h[0]}window.scrollTo(0,0);$('#cn').textContent='🥥 '+nC();const p=(location.hash||'#home').slice(1).split('/'),a=p[0];
a=='t'&&G[p[1]]?terr(p[1]):a=='l'&&G[p[1]]?play(p[1],+p[2]):a=='map'?map():a=='phare'?phare():a=='coffre'?coffre():a=='premium'?premium():home()}
try{if(localStorage.getItem('calm')=='1')toggleCalm()}catch(e){}
render();
</script></body></html>
